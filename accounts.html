<main class="main">
  <div class="page-head">
    <div><h1>Accounts</h1><p>Switch accounts and manage linked socials. Active account drives inbox and composer.</p></div>
    <button class="btn btn--ghost">+ Add account</button>
  </div>
  <div class="grid grid-2" id="accountCards"></div>
</main>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/platforms.js"></script>
<script src="assets/js/app.js"></script>
<script>
(function(){
  const HUB=window.HUB;
  const activeId = HUB.getActiveAccount().id;
  // restore connected state
  try{ const saved=JSON.parse(localStorage.getItem('hub.connected')||'{}'); Object.keys(saved).forEach(aid=>{ const acc=HUB.ACCOUNTS.find(a=>a.id===aid); if(!acc) return; Object.keys(saved[aid]).forEach(pid=>{ const s=acc.socials.find(x=>x.platform===pid); if(s) s.connected=saved[aid][pid]; }); }); }catch(e){}
  const cards=document.getElementById('accountCards');
  function render(){
    cards.innerHTML = HUB.ACCOUNTS.map(a=>`
      <div class="account-card ${a.id===HUB.getActiveAccount().id?'is-active':''}">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div style="display:flex;align-items:center;gap:10px">
            <span class="acc-avatar" style="background:${a.color};width:40px;height:40px;border-radius:10px;font-size:16px;display:grid;place-items:center;color:#fff;font-family:var(--font-display);font-weight:600">${a.name.charAt(0)}</span>
            <div><b style="font-family:var(--font-display);font-size:1.05rem">${a.name}</b><div style="font-size:12px;color:var(--muted-2)">${a.handle} · ${a.email}</div></div>
          </div>
          ${a.id!==HUB.getActiveAccount().id?`<button class="btn btn--ghost btn--sm" data-switch="${a.id}">Switch</button>`:`<span class="chip">Active</span>`}
        </div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted-2);margin:10px 0 6px">Linked socials</div>
        ${a.socials.map(s=>`
          <div class="acc-social">
            <span class="social-dot" style="background:${HUB.platform(s.platform).color}"></span>
            <span style="flex:1;font-size:13px">${HUB.platform(s.platform).name}</span>
            <span style="font-size:12px;color:var(--muted-2)">${s.handle}</span>
            <button class="toggle ${s.connected?'is-on':''}" data-toggle="${a.id}:${s.platform}" aria-label="toggle"></button>
          </div>`).join('')}
        <div style="margin-top:12px"><button class="btn btn--ghost btn--sm">+ Connect social</button></div>
      </div>`).join('');
    cards.querySelectorAll('[data-switch]').forEach(b=>b.addEventListener('click',()=>{ HUB.setActiveAccount(b.dataset.switch); location.reload(); }));
    cards.querySelectorAll('[data-toggle]').forEach(b=>{
      b.addEventListener('click',()=>{
        const [aid,pid]=b.dataset.toggle.split(':');
        const acc=HUB.ACCOUNTS.find(a=>a.id===aid);
        const s=acc.socials.find(x=>x.platform===pid);
        s.connected=!s.connected;
        // persist
        const saved=JSON.parse(localStorage.getItem('hub.connected')||'{}');
        saved[aid]=saved[aid]||{};
        saved[aid][pid]=s.connected;
        localStorage.setItem('hub.connected',JSON.stringify(saved));
        b.classList.toggle('is-on',s.connected);
      });
    });
  }
  render();
})();
</script>
</body>
</html>
